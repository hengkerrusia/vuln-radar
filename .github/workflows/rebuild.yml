name: Rebuild site

on:
  push:
    branches: [main]
    paths:
      - 'records/**'
      - 'build.py'
      - 'assets/**'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: python3 build.py

      - name: Commit rebuilt docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "Rebuild docs/ [skip ci]"
          git push
